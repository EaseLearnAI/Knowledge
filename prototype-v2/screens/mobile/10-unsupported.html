<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=440, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>暂未支持 · 极简内容收藏 AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css">
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../../styles/phone-frame.css">
<style>
  .behind {
    flex: 1;
    background: var(--paper-50);
    padding: 60px 20px 100px;
    filter: blur(2px);
    opacity: 0.55;
    pointer-events: none;
  }
  .behind .fake-title {
    font-family: var(--font-display);
    font-size: 28px;
    color: var(--ink-900);
    margin-bottom: 16px;
  }
  .behind .fake-card { height: 96px; background: var(--paper-100); border-radius: var(--r-md); margin-bottom: 10px; }

  /* iOS 风格 alert - 居中模态 */
  .alert {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 270px;
    background: rgba(250,250,247,0.96);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 14px;
    padding: 20px 16px 0;
    z-index: 95;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    text-align: center;
  }
  .alert-icon {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(184,134,43,0.12);
    color: #B8862B;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 12px;
    font-size: 18px;
  }
  .alert-title {
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 600;
    color: var(--ink-900);
    margin-bottom: 6px;
  }
  .alert-sub {
    font-size: 13px;
    color: var(--ink-500);
    line-height: 1.4;
    margin-bottom: 14px;
    padding: 0 4px;
  }
  .alert-url {
    background: var(--paper-100);
    border-radius: 8px;
    padding: 8px 10px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--ink-700);
    word-break: break-all;
    margin-bottom: 14px;
    text-align: left;
  }
  .alert-actions {
    display: flex;
    border-top: 1px solid rgba(15,15,14,0.1);
    margin: 0 -16px;
  }
  .alert-actions .btn {
    flex: 1;
    padding: 12px 8px;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-500);
    cursor: pointer;
    border-right: 1px solid rgba(15,15,14,0.1);
  }
  .alert-actions .btn:last-child { border-right: 0; color: var(--accent-500); font-weight: 600; }

  /* 底部小提示条 - 显示已自动归类 */
  .auto-tag {
    position: absolute;
    bottom: calc(var(--home-bar) + 24px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink-900);
    color: var(--paper-50);
    padding: 10px 14px;
    border-radius: 999px;
    font-size: 12px;
    display: flex; align-items: center; gap: 8px;
    z-index: 95;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  }
  .auto-tag i { color: var(--green-500); }
</style>
</head>
<body>
  <div class="phone-frame">
    <div class="dynamic-island"></div>
    <div class="phone-screen">
      <div class="status-bar">
        <span>9:41</span>
        <div class="right">
          <i class="fa-solid fa-signal" style="font-size:14px;"></i>
          <i class="fa-solid fa-wifi" style="font-size:13px;"></i>
          <span style="display:inline-flex;align-items:center;gap:1px;">
            <span style="width:22px;height:11px;border:1.2px solid currentColor;border-radius:3px;display:inline-block;position:relative;">
              <span style="position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:75%;background:currentColor;border-radius:1px;"></span>
            </span>
          </span>
        </div>
      </div>

      <div class="behind">
        <div class="fake-title">收藏库</div>
        <div class="fake-card"></div>
        <div class="fake-card"></div>
      </div>

      <div class="modal-backdrop"></div>

      <!-- iOS 风格居中 alert -->
      <div class="alert">
        <div class="alert-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <div class="alert-title">暂未支持</div>
        <div class="alert-sub">AI 暂不能解析这个链接。</div>
        <div class="alert-url">mp.weixin.qq.com/s?__biz=MzA5...</div>
        <div class="alert-actions">
          <div class="btn">不保留</div>
          <div class="btn">保留链接</div>
        </div>
      </div>

      <!-- 已自动归类小提示 -->
      <div class="auto-tag">
        <i class="fa-solid fa-circle-check"></i>
        已自动归到「待支持」
      </div>

      <div class="home-indicator"></div>
    </div>
  </div>
<style id="__fit_viewport_style__">
  html.fitv, html.fitv body { margin: 0; background: #0F0F0E; }
  html.fitv body { overflow: hidden; min-height: 100svh; min-height: 100vh; }
  html.fitv .phone-frame {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(var(--fit, 1));
    transform-origin: center center;
    margin: 0;
  }
</style>
<script id="__fit_viewport__">
  (function () {
    // 总览 iframe 内不缩放，保留预览逻辑
    if (window.self !== window.top) return;
    var el = document.documentElement;
    el.classList.add('fitv');
    var W = 430, H = 932, PAD = 40;
    function fit() {
      var s = Math.min((window.innerWidth - PAD) / W, (window.innerHeight - PAD) / H);
      el.style.setProperty('--fit', s.toFixed(4));
    }
    window.addEventListener('resize', fit);
    window.addEventListener('orientationchange', fit);
    fit();
  })();
</script>
</body>
</html>
