<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=440, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>添加 · 极简内容收藏 AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css">
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../../styles/phone-frame.css">
<style>
  /* ===== iOS 底部弹窗 ===== */
  .add-screen { background: #12120E; }
  .add-scrim {
    position: absolute; inset: 0;
    background: rgba(10,10,9,0.5);
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
    animation: fadeIn 0.25s var(--ease-out);
  }
  .add-sheet {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: var(--paper-50);
    border-radius: 22px 22px 0 0;
    padding: 10px 20px calc(var(--home-bar, 34px) + 16px);
    box-shadow: 0 -18px 50px rgba(0,0,0,0.35);
    animation: sheetUp 0.36s cubic-bezier(0.2,0.8,0.2,1);
  }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet-grabber {
    width: 38px; height: 5px; border-radius: 3px;
    background: var(--ink-200); margin: 0 auto 14px;
  }
  .sheet-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px;
  }
  .sheet-cancel { font-size: 15px; color: var(--ink-500); cursor: pointer; }
  .sheet-cancel:active { opacity: 0.6; }
  .sheet-title { font-size: 16px; font-weight: 600; color: var(--ink-900); }
  .sheet-side { width: 30px; }
  .sheet-desc {
    font-size: 13.5px; line-height: 1.6; color: var(--ink-500);
    margin: 0 2px 18px;
  }
  .sheet-field {
    display: flex; align-items: flex-start; gap: 12px;
    background: var(--paper-100);
    border-radius: 16px;
    padding: 20px 18px;
    min-height: 112px;
    margin-bottom: 14px;
  }
  .sheet-field > i { color: var(--ink-400); font-size: 18px; margin-top: 3px; }
  .sheet-input {
    flex: 1; border: 0; background: transparent; outline: none; resize: none;
    font-family: var(--font-mono); font-size: 14px; line-height: 1.65;
    color: var(--ink-900); word-break: break-all;
  }
  .sheet-detect {
    display: flex; align-items: center; gap: 12px;
    background: var(--paper-100);
    border-radius: 14px; padding: 12px 14px;
    margin-bottom: 22px;
  }
  .detect-badge {
    width: 34px; height: 34px; border-radius: 9px;
    background: #FF0050; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; flex-shrink: 0;
  }
  .detect-text { flex: 1; min-width: 0; }
  .detect-name { font-size: 14px; font-weight: 600; color: var(--ink-900); }
  .detect-desc { font-size: 12px; color: var(--ink-500); margin-top: 2px; }
  .detect-ok {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; font-weight: 600; color: #2F6F4A; flex-shrink: 0;
  }
  .primary-cta {
    height: 52px; width: 100%;
    background: var(--ink-900); color: var(--paper-50);
    border: 0; border-radius: 14px;
    font-family: inherit; font-size: 16px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background var(--t-base) var(--ease-out);
  }
  .primary-cta:hover { background: var(--accent-500); }
  .primary-cta:active { transform: scale(0.99); }
</style>
</head>
<body>
  <div class="phone-frame">
    <div class="dynamic-island"></div>
    <div class="phone-screen add-screen">
      <div class="status-bar">
        <span>9:41</span>
        <div class="right">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><path d="M1 8h2v2H1zM4 6h2v4H4zM7 4h2v6H7zM10 2h2v8h-2zM13 0h2v10h-2z"/></svg>
          <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><path d="M8 2.5C5.5 2.5 3.2 3.4 1.5 4.9L0 3.4C2.1 1.5 4.9 0.4 8 0.4s5.9 1.1 8 3l-1.5 1.5C12.8 3.4 10.5 2.5 8 2.5z" fill="currentColor"/></svg>
          <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="0.5" y="0.5" width="22" height="11" rx="3" stroke="currentColor"/><rect x="2" y="2" width="18" height="8" rx="1.5" fill="currentColor"/><rect x="23" y="4" width="2" height="4" rx="0.5" fill="currentColor" opacity="0.5"/></svg>
        </div>
      </div>

      <!-- 遮罩：点击关闭 -->
      <div class="add-scrim cancel"></div>

      <!-- iOS 底部弹窗 -->
      <div class="add-sheet">
        <div class="sheet-grabber"></div>
        <div class="sheet-head">
          <span class="sheet-cancel cancel">取消</span>
          <span class="sheet-title">添加内容</span>
          <span class="sheet-side"></span>
        </div>

        <p class="sheet-desc">粘贴任意链接（小红书、播客、YouTube、B 站或网页），Memo 会自动识别来源、提取正文并生成摘要，帮你归档。</p>

        <div class="sheet-field">
          <i class="fa-solid fa-link"></i>
          <textarea class="sheet-input" rows="3" spellcheck="false">https://www.xiaohongshu.com/explore/abc123def456</textarea>
        </div>

        <button class="primary-cta">收藏到 Memo</button>
      </div>

      <div class="home-indicator"></div>
    </div>
  </div>
<style id="__fit_viewport_style__">
  html.fitv, html.fitv body { margin: 0; background: #0F0F0E; }
  html.fitv body { overflow: hidden; min-height: 100svh; min-height: 100vh; }
  html.fitv .phone-frame {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(var(--fit, 1));
    transform-origin: center center;
    margin: 0;
  }
</style>
<script id="__fit_viewport__">
  (function () {
    if (window.self !== window.top) return;
    var el = document.documentElement;
    el.classList.add('fitv');
    var W = 430, H = 932, PAD = 40;
    function fit() {
      var s = Math.min((window.innerWidth - PAD) / W, (window.innerHeight - PAD) / H);
      el.style.setProperty('--fit', s.toFixed(4));
    }
    window.addEventListener('resize', fit);
    window.addEventListener('orientationchange', fit);
    fit();
  })();
</script>
</body>
</html>
