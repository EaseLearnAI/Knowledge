<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=440, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>开始使用 · 极简内容收藏 AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../../styles/phone-frame.css">
<style>
  .onboard {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 0 28px;
    position: relative;
  }

  /* —— 跳过 —— */
  .skip {
    align-self: flex-end;
    font-size: 13px;
    color: var(--ink-500);
    font-weight: 500;
    margin-top: 12px;
  }

  /* —— 主体插画/概念区 —— */
  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
  }

  /* 步骤 1：三层圆 + 链接 */
  .visual-1 {
    width: 260px; height: 260px;
    position: relative;
    margin-bottom: 32px;
  }
  .visual-1 .ring {
    position: absolute; inset: 0;
    border-radius: 50%;
    border: 1.5px dashed var(--ink-100);
    animation: spin 24s linear infinite;
  }
  .visual-1 .ring.r2 {
    inset: 20px;
    border-style: solid;
    border-color: var(--ink-100);
    border-width: 1px;
    animation: spin 18s linear infinite reverse;
  }
  .visual-1 .ring.r3 {
    inset: 50px;
    border: 1px solid var(--ink-100);
    animation: none;
  }
  .visual-1 .core {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 90px; height: 90px;
    border-radius: 50%;
    background: var(--ink-900);
    color: var(--paper-50);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 30px rgba(15,15,14,0.2);
  }
  .visual-1 .floating {
    position: absolute;
    width: 56px; height: 56px;
    border-radius: 16px;
    background: var(--paper-50);
    border: 1px solid var(--ink-100);
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-900);
    box-shadow: var(--shadow-md);
  }
  .visual-1 .floating.f1 { top: 10px; left: 30px; animation: float 3s ease-in-out infinite; }
  .visual-1 .floating.f2 { top: 60px; right: 0; animation: float 3s ease-in-out 0.5s infinite; }
  .visual-1 .floating.f3 { bottom: 30px; left: 0; animation: float 3s ease-in-out 1s infinite; }
  .visual-1 .floating.f4 { bottom: 0; right: 40px; animation: float 3s ease-in-out 1.5s infinite; }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 步骤 2：来源图标流入 */
  .visual-2 {
    width: 280px; height: 200px;
    position: relative;
    margin-bottom: 32px;
  }
  .visual-2 .icon {
    position: absolute;
    width: 56px; height: 56px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    color: white;
    font-weight: 700;
    font-size: 18px;
    box-shadow: var(--shadow-md);
  }
  .visual-2 .icon.i1 { top: 0; left: 30px; background: #FF0050; animation: slide 1.2s ease-out; }
  .visual-2 .icon.i2 { top: 30px; left: 110px; background: #FF0000; animation: slide 1.2s ease-out 0.2s backwards; }
  .visual-2 .icon.i3 { top: 60px; left: 190px; background: #000; animation: slide 1.2s ease-out 0.4s backwards; }
  .visual-2 .icon.i4 { top: 120px; left: 70px; background: #2A2A28; animation: slide 1.2s ease-out 0.6s backwards; }
  .visual-2 .icon.i5 { top: 120px; left: 150px; background: #4A6B8A; animation: slide 1.2s ease-out 0.8s backwards; }
  @keyframes slide {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 步骤 3：对话气泡 */
  .visual-3 {
    width: 280px; height: 220px;
    position: relative;
    margin-bottom: 32px;
  }
  .visual-3 .bubble {
    position: absolute;
    background: var(--paper-100);
    border-radius: 14px;
    padding: 10px 14px;
    font-size: 12px;
    line-height: 1.4;
    max-width: 180px;
    border: 1px solid var(--ink-100);
  }
  .visual-3 .bubble.b1 {
    top: 10px; left: 0;
    animation: pop 0.6s ease-out;
  }
  .visual-3 .bubble.b2 {
    top: 70px; right: 0;
    background: var(--ink-900);
    color: var(--paper-50);
    border-color: var(--ink-900);
    animation: pop 0.6s ease-out 0.3s backwards;
  }
  .visual-3 .bubble.b3 {
    top: 130px; left: 20px;
    animation: pop 0.6s ease-out 0.6s backwards;
  }
  @keyframes pop {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }

  /* 文字 */
  .onboard h2 {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 500;
    line-height: 1.2;
    letter-spacing: -0.6px;
    margin-bottom: 12px;
  }
  .onboard .desc {
    color: var(--ink-500);
    font-size: 15px;
    line-height: 1.55;
    max-width: 320px;
  }
  .onboard .desc strong {
    color: var(--ink-900);
    font-weight: 600;
  }

  /* —— 底部 —— */
  .footer {
    padding: 12px 0 calc(var(--home-bar) + 12px);
  }
  .dots {
    display: flex; gap: 6px;
    justify-content: center;
    margin-bottom: 20px;
  }
  .dots span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--ink-100);
    transition: all 0.3s;
  }
  .dots span.active {
    width: 22px;
    background: var(--ink-900);
    border-radius: 3px;
  }
  .footer .btn-primary { box-shadow: 0 4px 20px rgba(15,15,14,0.15); }
  .footer .signin {
    text-align: center;
    margin-top: 10px;
    font-size: 12px;
    color: var(--ink-500);
  }
  .footer .signin a {
    color: var(--ink-900);
    font-weight: 500;
  }

  /* —— 状态栏 —— */
  .status-bar { color: var(--ink-900); }
</style>
</head>
<body>
  <div class="phone-frame">
    <div class="dynamic-island"></div>
    <div class="phone-screen">
      <div class="status-bar">
        <span>9:41</span>
        <div class="right">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><path d="M1 8h2v2H1zM4 6h2v4H4zM7 4h2v6H7zM10 2h2v8h-2zM13 0h2v10h-2z"/></svg>
          <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><path d="M8 2.5C5.5 2.5 3.2 3.4 1.5 4.9L0 3.4C2.1 1.5 4.9 0.4 8 0.4s5.9 1.1 8 3l-1.5 1.5C12.8 3.4 10.5 2.5 8 2.5z" fill="currentColor"/></svg>
          <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="0.5" y="0.5" width="22" height="11" rx="3" stroke="currentColor"/><rect x="2" y="2" width="18" height="8" rx="1.5" fill="currentColor"/><rect x="23" y="4" width="2" height="4" rx="0.5" fill="currentColor" opacity="0.5"/></svg>
        </div>
      </div>

      <div class="onboard">
        <a class="skip">跳过</a>

        <div class="stage">

          <!-- 步骤 1：扔进来 -->
          <div class="visual-1" id="v1">
            <div class="ring"></div>
            <div class="ring r2"></div>
            <div class="ring r3"></div>
            <div class="core">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
              </svg>
            </div>
            <div class="floating f1">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="color:#FF0050;"><path d="M5 4h14a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3z"/></svg>
            </div>
            <div class="floating f2">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="color:#FF0000;"><polygon points="6 4 20 12 6 20 6 4"/></svg>
            </div>
            <div class="floating f3">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="color:#000;"><rect x="3" y="6" width="18" height="12" rx="2"/></svg>
            </div>
            <div class="floating f4">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="color:#4A6B8A;"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            </div>
          </div>

          <h2>扔进来，<br>先别整理</h2>
          <p class="desc">粘贴一个链接或上传一段音频，AI 会自动提取内容、生成摘要和标签。</p>

        </div>

        <div class="footer">
          <div class="dots">
            <span class="active"></span>
            <span></span>
            <span></span>
          </div>
          <button class="btn-primary">
            下一步
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </button>
          <div class="signin">
            已有账号？<a>登录</a>
          </div>
        </div>
      </div>
      <div class="home-indicator"></div>
    </div>
  </div>
<style id="__fit_viewport_style__">
  html.fitv, html.fitv body { margin: 0; background: #0F0F0E; }
  html.fitv body { overflow: hidden; min-height: 100svh; min-height: 100vh; }
  html.fitv .phone-frame {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(var(--fit, 1));
    transform-origin: center center;
    margin: 0;
  }
</style>
<script id="__fit_viewport__">
  (function () {
    // 总览 iframe 内不缩放，保留预览逻辑
    if (window.self !== window.top) return;
    var el = document.documentElement;
    el.classList.add('fitv');
    var W = 430, H = 932, PAD = 40;
    function fit() {
      var s = Math.min((window.innerWidth - PAD) / W, (window.innerHeight - PAD) / H);
      el.style.setProperty('--fit', s.toFixed(4));
    }
    window.addEventListener('resize', fit);
    window.addEventListener('orientationchange', fit);
    fit();
  })();
</script>
</body>
</html>
