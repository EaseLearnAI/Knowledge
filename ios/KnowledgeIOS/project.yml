name: KnowledgeIOS

options:
  bundleIdPrefix: ai.easelearn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: "NO"

targets:
  KnowledgeIOS:
    type: application
    platform: iOS
    info:
      path: KnowledgeIOS/Resources/Info.plist
      properties:
        CFBundleDisplayName: Memo
        ITSAppUsesNonExemptEncryption: false
        MEMO_API_BASE_URL: "http://127.0.0.1:3100/api/v1"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: false
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    sources:
      - path: KnowledgeIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.easelearn.knowledge
        PRODUCT_NAME: Memo
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

  KnowledgeIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KnowledgeIOSUITests
    dependencies:
      - target: KnowledgeIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.easelearn.knowledge.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: KnowledgeIOS

  KnowledgeIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KnowledgeIOSTests
    dependencies:
      - target: KnowledgeIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.easelearn.knowledge.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Memo.app/Memo"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  KnowledgeIOS:
    build:
      targets:
        KnowledgeIOS: all
        KnowledgeIOSUITests:
          - test
        KnowledgeIOSTests:
          - test
    test:
      gatherCoverageData: true
      targets:
        - KnowledgeIOSTests
        - KnowledgeIOSUITests
