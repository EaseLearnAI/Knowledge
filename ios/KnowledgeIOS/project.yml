name: KnowledgeIOS

options:
  bundleIdPrefix: ai.easelearn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: "NO"

targets:
  KnowledgeIOS:
    type: application
    platform: iOS
    sources:
      - path: KnowledgeIOS
      - path: ../../prototype-v2/app.html
        buildPhase: resources
      - path: ../../prototype-v2/styles
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.easelearn.knowledge
        PRODUCT_NAME: Memo
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Memo
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "NO"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIRequiresFullScreen: "YES"
        INFOPLIST_KEY_UIStatusBarHidden: "YES"
        INFOPLIST_KEY_UIViewControllerBasedStatusBarAppearance: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
          - UIInterfaceOrientationPortrait
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

  KnowledgeIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KnowledgeIOSUITests
    dependencies:
      - target: KnowledgeIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.easelearn.knowledge.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: KnowledgeIOS

schemes:
  KnowledgeIOS:
    build:
      targets:
        KnowledgeIOS: all
        KnowledgeIOSUITests:
          - test
    test:
      gatherCoverageData: true
      targets:
        - KnowledgeIOSUITests
